name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # Unit and integration tests (Testcontainers needs Docker, which the runner has), Spotless, NullAway.
      - run: ./mvnw -B verify

  openapi-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx --yes @redocly/cli@latest lint api/openapi.yaml

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # Cloud Native Buildpacks (Paketo): a non-root image on a JRE 25, no Dockerfile to maintain.
      - name: Build the image
        run: ./mvnw -B -DskipTests spring-boot:build-image -Dspring-boot.build-image.imageName=ledgerly:ci
      - name: Check that the image does not run as root
        run: |
          user=$(docker image inspect ledgerly:ci --format '{{.Config.User}}')
          echo "image user: $user"
          test -n "$user" && test "$user" != "root" && test "$user" != "0"
      - name: Scan the image for known vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ledgerly:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      # The CycloneDX SBOM that the Maven build wrote into the jar, kept as a build artifact.
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: target/classes/META-INF/sbom/application.cdx.json
