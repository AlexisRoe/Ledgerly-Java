services:
  lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "3000:3000"   # Grafana (admin/admin)
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ledgerly
      POSTGRES_USER: ledgerly
      POSTGRES_PASSWORD: ledgerly
    ports:
      - "5432:5432"

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: server -s3 -s3.port=8333 -dir=/data
    ports:
      - "8333:8333"   # S3 API (no auth configured: local only)

  clamav:
    image: clamav/clamav:stable
    ports:
      - "3310:3310"   # clamd; the first start downloads signatures and takes a few minutes

  # Only needed with the `keycloak` profile (SPRING_PROFILES_ACTIVE=local,keycloak): the identity provider that
  # replaces Ledgerly's own login. The realm (client, audience mapper, two users) is imported on first start.
  # Users: alice@example.com / alice-password (email verified), bob@example.com / bob-password (not verified).
  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/ledgerly-realm.json:/opt/keycloak/data/import/ledgerly-realm.json:ro
    ports:
      - "8180:8080"   # admin console: http://localhost:8180 (admin/admin)
