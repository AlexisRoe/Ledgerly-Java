spring:
  application:
    name: ledgerly
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      # The app also counts bytes itself (ledgerly.limits.max-upload-size); these cap the request at the door.
      max-file-size: 10MB
      max-request-size: 11MB
  batch:
    job:
      # Jobs are started by the application (an import upload), never at start-up.
      enabled: false
    jdbc:
      # Flyway creates the Batch tables (V6__imports.sql).
      initialize-schema: never
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  tomcat:
    # After rejecting an oversized upload the server reads (and discards) up to this much so the client can
    # still receive the 413. Anything larger just has its connection closed.
    max-swallow-size: 16MB

logging:
  structured:
    format:
      console: ecs

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 1.0
