spring:
  application:
    name: ledgerly
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

logging:
  structured:
    format:
      console: ecs

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 1.0
